# PlatformIO (lib_deps / platform URL in platformio.ini) is not a Dependabot ecosystem;
# those pins are reviewed by hand. Only GitHub Actions are tracked here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 3
