; Bambu Monitor firmware for the LilyGO T-Encoder-Pro (ESP32-S3R8, 1.2" 390x390 AMOLED)

[platformio]
default_envs = t-encoder-pro

[env:t-encoder-pro]
; pioarduino = Arduino-ESP32 3.x (the official espressif32 platform is stuck on 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/version.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=1
  -DMQTT_MAX_PACKET_SIZE=65536

lib_ldf_mode = chain
lib_deps =
  lvgl/lvgl@8.3.11
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0

; Wi-Fi updates once the device is on your network:  pio run -e t-encoder-pro-ota -t upload
; (add  upload_flags = --auth=<web password>  if you set a web UI password)
[env:t-encoder-pro-ota]
extends = env:t-encoder-pro
upload_protocol = espota
upload_port = bambu-monitor.local
